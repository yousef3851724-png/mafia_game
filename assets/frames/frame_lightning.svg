<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow_lightning" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="100" cy="100" r="98" fill="url(#glow_lightning)"/>

  <!-- Main ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#00E5FF" stroke-width="4"/>

  <!-- Accent ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#2979FF" stroke-width="2" opacity="0.75"/>

  <!-- Decorative dots -->
  <circle cx="100" cy="10" r="3.5" fill="#00E5FF"/>
  <circle cx="190" cy="100" r="3.5" fill="#2979FF"/>
  <circle cx="100" cy="190" r="3.5" fill="#00E5FF"/>
  <circle cx="10" cy="100" r="3.5" fill="#2979FF"/>
</svg>