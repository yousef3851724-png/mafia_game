<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="50%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <text x="50%" y="50%" dy="0.35em" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="75" font-weight="900"
        fill="url(#logoGradient)" filter="url(#glow)"
        transform="skewX(-10)">
    MAFIA-RADICAL
  </text>
</svg>
