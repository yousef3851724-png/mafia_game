<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مافیا رادیکال</title>
<meta name="description" content="مافیا رادیکال؛ بازی گروهی مافیا برای اندروید">
<style>
  :root { --bg:#0e0e12; --fg:#f2f2f5; --muted:#9a9aa8; --accent:#d62839; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:Tahoma, "Vazirmatn", sans-serif; line-height:1.9; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
  h1 { font-size:2.6rem; margin-bottom:8px; }
  h1 span { color:var(--accent); }
  p { color:var(--muted); max-width:460px; margin:0 auto 28px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:14px 36px; border-radius:12px; font-size:1.1rem; }
  ul { list-style:none; padding:0; margin:36px 0 0; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  li { border:1px solid #2a2a35; border-radius:999px; padding:6px 16px; color:var(--muted); font-size:.9rem; }
  footer { margin-top:48px; color:#5c5c6a; font-size:.8rem; }
</style>
</head>
<body>
  <h1>مافیا <span>رادیکال</span></h1>
  <p>بازی گروهی مافیا برای اندروید؛ نقش بگیر، شک کن، رأی بده.</p>
  <a class="btn" href="#" id="dl">دانلود برای اندروید</a>

    <li>بازی گروهی</li>
  </ul>
  <footer>© مافیا رادیکال</footer>
</body>
</html>
