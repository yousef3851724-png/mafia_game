name: Production Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (for example 1.0.1)'
        required: true
        default: '1.2.2'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release_metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION}"
            TAG_NAME="v${VERSION#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          if (( BUILD_NUMBER < 5 )); then
            BUILD_NUMBER=5
          fi

          echo "version=${VERSION}" >> "$GITHUB_ENV"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "release_name=Mafia Radical ${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=Mafia Radical ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/mafia-release.jks
          echo "KEYSTORE_SHA256: $(sha256sum android/mafia-release.jks | cut -d" " -f1)"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../mafia-release.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release APK
        env:
          VERSION: ${{ steps.release_metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.release_metadata.outputs.build_number }}
        run: flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Build signed release AAB
        env:
          VERSION: ${{ steps.release_metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.release_metadata.outputs.build_number }}
        run: flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Attest signed APK provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "mafia-radical-${VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "mafia-radical-${VERSION}.aab"

      - name: Upload release APK and AAB as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mafia-radical-${{ steps.release_metadata.outputs.version }}
          path: |
            mafia-radical-*.apk
            mafia-radical-*.aab
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag_name }}
          name: ${{ steps.release_metadata.outputs.release_name }}
          generate_release_notes: true
          files: |
            mafia-radical-*.apk
            mafia-radical-*.aab

      - name: Clean up signing material
        if: always()
        run: |
          rm -f android/mafia-release.jks android/key.properties