name: Update Streak Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GitHub Readme Streak Stats Action
        uses: DenverCoder1/github-readme-streak-stats@v1.8.2
        with:
          user: yousef3851724-png
          token: ${{ secrets.GITHUB_TOKEN }}
          output: streak.svg

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add streak.svg
          git diff --staged --quiet || git commit -m "Update streak stats"
          git push