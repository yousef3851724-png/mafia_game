name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
  push:
    branches: [cloudflare-workers-migration]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check account id shape
        env:
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "len=${#ACC}"
          echo "$ACC" | grep -Eq '^[0-9a-f]{32}$' && echo "format=OK" || echo "format=BAD"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          wranglerVersion: "4.162.0"
          command: deploy
