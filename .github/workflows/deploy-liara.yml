name: Deploy to Liara
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @liara/cli@5
      - run: liara deploy --app "mafia-radical-api" --api-token "$LIARA_API_TOKEN" --platform node --port 3000 --detach
        working-directory: backend
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
