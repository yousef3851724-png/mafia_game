name: Test Hyperdrive Worker (no deploy)

on:
  push:
    branches: [feature/cloudflare-hyperdrive-postgres]
    paths:
      - 'cloudflare/worker/**'
      - '.github/workflows/test-hyperdrive-worker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/worker/**'
      - '.github/workflows/test-hyperdrive-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
