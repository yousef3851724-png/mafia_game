name: Validate and deploy Mafia Radical Cloudflare edge gateway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker syntax
        run: node --check worker/index.js
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - name: Check deployment configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$BACKEND_ORIGIN" || { echo "::error::Missing BACKEND_ORIGIN environment variable"; exit 1; }
          case "$BACKEND_ORIGIN" in https://*) ;; *) echo "::error::BACKEND_ORIGIN must use HTTPS"; exit 1 ;; esac
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var BACKEND_ORIGIN:${{ vars.BACKEND_ORIGIN }}
