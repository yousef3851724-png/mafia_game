name: CD-Liara
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: update-liara
        working-directory: backend
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm i -g @liara/cli@9
          liara deploy --app="mafia-radical-apt" --api-token="$LIARA_TOKEN" --no-app-logs
