# 1. گرفتن آخرین نسخه
git pull origin main

# 2. ساخت شاخه جدید
git checkout -b update-build-yml

# 3. بازنویسی کامل فایل (محتواهای داخل EOF را با محتوای جدید خود عوض کنید)
cat > build.yml << 'EOF'
# اینجا محتوای جدید فایل build.yml را قرار دهید
# مثلاً:
name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
EOF

# 4. افزودن، کامیت و پوش کردن
git add build.yml
git commit -m "به‌روزرسانی کامل build.yml"
git push origin update-build-yml

# 5. لینک ساخت Pull Request
echo "✅ لینک ساخت Pull Request:"
echo "https://github.com/$(git remote get-url origin | sed 's/.*://' | sed 's/\.git//')/compare/main...update-build-yml"
