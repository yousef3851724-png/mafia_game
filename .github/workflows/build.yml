name: Build Mafia Radical APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mafia-ai-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check backend JavaScript syntax
        run: npm run check
      - name: Run backend tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Validate production signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Missing KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing KEY_PASSWORD repository secret" && exit 1)

      - name: Prepare production signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | tr -d "[:space:]" | openssl base64 -d -A -out android/mafia-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../mafia-release.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release APK with unique Android versionCode
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build apk --release --build-number "$BUILD_NUMBER" --dart-define=MAFIA_API_BASE_URL=https://mafia-radical-api.liara.run

      - name: Verify APK exists and is signed
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose "$APK"

      - name: Attest release APK provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mafia-radical-v${{ github.run_number }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create draft test release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Mafia Radical — Build ${{ github.run_number }}
          body: |
            Mafia Radical test build.
            Android versionCode: ${{ github.run_number }}
            Built from commit: ${{ github.sha }}
            Install this build over a previous build only if it was signed with the same Mafia Radical release key.
          draft: true
          prerelease: true
          make_latest: false
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish test release after APK upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "test-build-${{ github.run_number }}" --draft=false

      - name: Clean up signing material
        if: always()
        run: rm -f android/mafia-release.jks android/key.properties
