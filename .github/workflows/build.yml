name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # نسخه ۱۷ برای نسخه‌های جدید اندروید و Gradle الزامی است

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # یا هر نسخه‌ای که روی سیستم خودت استفاده می‌کنی
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Clean and Repair (Fixing Unsupported Gradle error)
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk
