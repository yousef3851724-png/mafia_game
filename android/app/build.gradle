plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.mafiaradical.app" // یا هر نام یکتای دیگری که در فروشگاه ثبت می‌کنید
    compileSdk = 34
    
    // این خط مهم‌ترین بخش برای حل خطای NDK است:
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId = "com.mafiaradical.app" // باید دقیقاً با namespace یکی باشد
        minSdk = 23
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // امضای موقت با کلید debug تا فعلا بیلد ریلیز هم اجرا شود.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.radical.mafia"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    // بقیه تنظیمات (buildTypes, etc.)
}
