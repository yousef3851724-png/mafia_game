name: mafia_radical
description: "مافیا رادیکال - اپلیکیشن مدیریت بازی مافیا"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.6

  # Routing
  go_router: ^14.2.0

  # Dependency Injection
  get_it: ^7.7.0

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Logging
  logger: ^2.4.0

  # UI / Icons
  cupertino_icons: ^1.0.8

  # Local Storage
  shared_preferences: ^2.3.2

  # Animations
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.13.1

  # Splash Screen Generator
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

# ---- Launcher Icon Config ----
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

# ---- Splash Screen Config ----
flutter_native_splash:
  color: "#0D0D0D"
  image: assets/images/app_icon.png
  android_12:
    color: "#0D0D0D"
    image: assets/images/app_icon.png
