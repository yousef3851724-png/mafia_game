name: my_game_app
description: A Tic-Tac-Toe game with history and settings.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.4.9
  get_it: ^7.6.4

  # Router
  go_router: ^13.2.0

  # Storage & Database
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Logger
  logger: ^2.0.2+1

  # Utils
  equatable: ^2.0.5
  path_provider: ^2.1.1
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
