name: mafia_radical
description: "مافیا رادیکال - اپلیکیشن مدیریت بازی مافیا"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  equatable: ^2.0.7
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.6
  go_router: ^14.2.0
  get_it: ^7.7.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  logger: ^2.4.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0D0D0D"
  image: assets/images/app_icon.png
  android_12:
    color: "#0D0D0D"
    image: assets/images/app_icon.png
