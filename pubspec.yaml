name: mafia_radical
description: "مافیا رادیکال — اپلیکیشن گرداننده هوشمند بازی مافیا"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Dependency injection
  get_it: ^7.7.0

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Utilities
  equatable: ^2.0.5
  logger: ^2.4.0
  wakelock_plus: ^1.2.5
  package_info_plus: ^8.0.0

  # Splash & Icons
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn-regular
          weight: 400
        - asset: assets/fonts/vazirmatn-medium
          weight: 500
        - asset: assets/fonts/vazirmatn-bold
          weight: 700
 

# تنظیمات پکیج اسپلش اسکرین
flutter_native_splash:
  color: "#101218"
  image: assets/images/splash.png
  android: true
  ios: false

# تنظیمات پکیج آیکون برنامه
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
