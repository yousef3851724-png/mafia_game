name: mafia_radical
description: "مافیا رادیکال - اپلیکیشن مدیریت بازی مافیا"
publish_to: 'none'
version: 1.2.14+15

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  audioplayers: ^6.0.0
  crypto: ^3.0.3
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter
  equatable: ^2.0.7
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.6
  go_router: ^14.2.0
  get_it: ^7.7.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  logger: ^2.4.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  lottie: ^3.1.2
  flutter_svg: ^2.0.17
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
  uses-material-design: true
  assets:
    - assets/audio/narrator/
    - assets/avatars_v2/
    - assets/frames/set_24/
    - assets/frames/set_oval/
    - assets/lobby/
    - assets/avatars/set_70/
    - assets/stickers/set_1/
    - assets/stickers/set_2/
    - assets/tombstones/
    - assets/avatars/set_29/
    - assets/images/
    - assets/icon/
    - assets/avatars/
    - assets/logo/
    - assets/frames/
    - assets/stickers/
    - assets/chat/
    - assets/game/

# Android launcher and native splash use the checked-in native resources:
# android/app/src/main/res/drawable/mafia_radical_launcher.xml
# android/app/src/main/res/drawable*/launch_background.xml

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/logo/app_icon_round.png"
  adaptive_icon_background: "assets/logo/app_icon_bg.png"
  adaptive_icon_foreground: "assets/logo/app_icon_fg.png"
