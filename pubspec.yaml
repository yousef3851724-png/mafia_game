name: mafia_radical
description: "Mafia Radical - بازی مافیا رادیکال"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Helpers
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.2.1

  # State Management & Routing
  provider: ^6.1.2
  go_router: ^14.0.0

  # Database & Storage
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Dependency Injection
  get_it: ^7.7.0

  # Utilities
  logger: ^2.2.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/fonts/

  # Fonts
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
